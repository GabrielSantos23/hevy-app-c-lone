name: iOS IPA for sideloading

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build without signing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Repforge.xcworkspace \
            -scheme Repforge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_DEBUG_DYLIB=NO \
            | tail -n 200

      - name: Ad-hoc sign with the app's entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/Repforge.app
          find "$APP" \( -name '*.framework' -o -name '*.dylib' \) -print0 \
            | xargs -0 -n1 codesign --force --sign -
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -e "$EXT" ] || continue
            NAME=$(basename "$EXT" .appex)
            ENT=$(find ios -path "*$NAME*" -name '*.entitlements' | head -n1)
            codesign --force --sign - ${ENT:+--entitlements "$ENT"} "$EXT"
          done
          ENT=$(find ios/Repforge -name '*.entitlements' | head -n1)
          if [ -n "$ENT" ]; then
            cp "$ENT" free.entitlements
            for KEY in aps-environment com.apple.developer.healthkit com.apple.developer.healthkit.access com.apple.developer.healthkit.background-delivery; do
              /usr/libexec/PlistBuddy -c "Delete :$KEY" free.entitlements 2>/dev/null || true
            done
            ENT=free.entitlements
          fi
          codesign --force --sign - ${ENT:+--entitlements "$ENT"} "$APP"
          echo "--- app entitlements"
          codesign -d --entitlements - "$APP" || true
          for EXT in "$APP"/PlugIns/*.appex; do
            [ -e "$EXT" ] || continue
            echo "--- $(basename "$EXT") entitlements"
            codesign -d --entitlements - "$EXT" || true
          done

      - name: Package the IPAs
        run: |
          APP=build/Build/Products/Release-iphoneos/Repforge.app
          package() {
            rm -rf Payload && mkdir Payload
            cp -R "$1" Payload/Repforge.app
            zip -qry "$2" Payload
          }
          package "$APP" Repforge.ipa

          cp -R "$APP" sidestore.app
          /usr/libexec/PlistBuddy \
            -c "Add :keychain-access-groups array" \
            -c "Add :keychain-access-groups:0 string AAAAAAAAAA.dev.gabs.repforge" \
            keychain.entitlements
          codesign --force --sign - --entitlements keychain.entitlements sidestore.app/PlugIns/*.appex
          codesign --force --sign - --entitlements keychain.entitlements sidestore.app
          package sidestore.app Repforge-sidestore.ipa

          # Same as above plus HealthKit, to test whether SideStore's free signing keeps it.
          cp keychain.entitlements health.entitlements
          /usr/libexec/PlistBuddy \
            -c "Add :com.apple.developer.healthkit bool true" \
            -c "Add :com.apple.developer.healthkit.access array" \
            health.entitlements
          cp -R sidestore.app health.app
          codesign --force --sign - --entitlements health.entitlements health.app
          package health.app Repforge-sidestore-healthkit.ipa

          # HealthKit plus the widgets' App Group. SideStore keeps both only once Xcode has
          # enabled them on its App ID (dev.gabs.repforge.<team>); it renames the group.
          cp keychain.entitlements group.entitlements
          /usr/libexec/PlistBuddy \
            -c "Add :com.apple.security.application-groups array" \
            -c "Add :com.apple.security.application-groups:0 string group.dev.gabs.repforge" \
            group.entitlements
          cp group.entitlements full.entitlements
          /usr/libexec/PlistBuddy \
            -c "Add :com.apple.developer.healthkit bool true" \
            -c "Add :com.apple.developer.healthkit.access array" \
            full.entitlements
          cp -R sidestore.app full.app
          codesign --force --sign - --entitlements group.entitlements full.app/PlugIns/*.appex
          codesign --force --sign - --entitlements full.entitlements full.app
          package full.app Repforge-sidestore-full.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: Repforge-ipa
          path: Repforge*.ipa
          retention-days: 7
